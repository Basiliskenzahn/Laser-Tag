<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="icon" href="data:," />
    <title>Result · Laser Tag</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../components.css" />
  </head>
  <body>
    <main class="screen">
      <div class="stack stack--tight">
        <span class="label">Match over</span>
        <!-- Losing player: "You lose" with the same styling. -->
        <h1 class="title title--xl">You win</h1>
        <p class="subtitle">3 rounds to 1 against Rex.</p>
      </div>

      <dl class="list" aria-label="Match stats">
        <div class="list__row"><dt class="list__label">Hits</dt><dd class="list__value">9 / 14</dd></div>
        <div class="list__row"><dt class="list__label">Headshots</dt><dd class="list__value">3</dd></div>
        <div class="list__row"><dt class="list__label">Accuracy</dt><dd class="list__value">64%</dd></div>
        <div class="list__row"><dt class="list__label">Match time</dt><dd class="list__value">4:12</dd></div>
      </dl>

      <div class="spacer"></div>

      <div class="stack">
        <button class="btn btn--light" type="button">Rematch</button>
        <button class="btn btn--ghost" type="button">Leave room</button>
      </div>
    </main>
  </body>
</html>
