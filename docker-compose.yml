services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - '4000' # internal only - reached through the frontend's nginx reverse proxy
    # Nothing but a CI deploy ever starts this stack, and CI only runs on a push, so without
    # this a reboot or an OOM kill left the game down until a human noticed.
    restart: unless-stopped
    # Readiness, not liveness: the frontend's depends_on waits on this, so nginx never
    # accepts traffic while aiohttp is not yet listening. `python -c` because
    # python:3.12-slim has neither curl nor wget. GET / is the health route in backend/app.py.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:4000/', timeout=3) as r:
                  sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '8080:80'
      - '3443:443'
    volumes:
      # Keep the self-signed cert across restarts so phones don't have to re-accept it.
      - certs:/certs
    restart: unless-stopped
    # Checks the cert's expiry as well as nginx's liveness: an expired cert still starts nginx
    # and still gets served on 443, and this is what catches a container that has been up long
    # enough to outlive its own cert without ever re-running the entrypoint.
    healthcheck:
      test:
        - CMD-SHELL
        - openssl x509 -checkend 86400 -noout -in /certs/cert.pem && wget -q -O /dev/null http://127.0.0.1/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      backend:
        # Not the short list form: that waits only for the container to be started, which left
        # every deploy a window where /api/ and /events/ both answered 502.
        condition: service_healthy

  # Both test services are in the `test` profile, so `docker compose up` does not start them:
  #   docker compose run --rm tests
  #   docker compose run --rm backend-tests
  # See docs/operations/docker.md and docs/development/testing.md.
  tests:
    image: node:22-bookworm-slim
    profiles:
      - test
    working_dir: /app
    volumes:
      - .:/app
    # No `npm ci`: no test resolves a bare specifier, so it downloaded ~180 MB of MediaPipe
    # and ONNX Runtime for nothing. test/deploy-robustness.test.js pins both halves of that.
    command: npm test

  backend-tests:
    image: python:3.12-slim
    profiles:
      - test
    working_dir: /app
    volumes:
      - .:/app
      - backend-pip-cache:/root/.cache/pip
    command: sh -c "pip install -q -r backend/requirements.txt && python -m unittest discover -s backend -p 'test_*.py' -v"

volumes:
  certs:
  backend-pip-cache:
