services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - '4000' # internal only - reached through the frontend's nginx reverse proxy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '8080:80'
      - '3443:443'
    volumes:
      # Keep the self-signed cert across restarts so phones don't have to re-accept it.
      - certs:/certs
    depends_on:
      - backend

  tests:
    image: node:20-bookworm-slim
    profiles:
      - test
    working_dir: /app
    volumes:
      - .:/app
      - test-node-modules:/app/node_modules
    command: sh -c "npm ci && npm test"

  backend-tests:
    image: python:3.12-slim
    profiles:
      - test
    working_dir: /app
    volumes:
      - .:/app
      - backend-pip-cache:/root/.cache/pip
    command: sh -c "pip install -q -r backend/requirements.txt && python -m unittest discover -s backend -p 'test_*.py' -v"

volumes:
  certs:
  test-node-modules:
  backend-pip-cache:
