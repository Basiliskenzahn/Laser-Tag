services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - '4000' # internal only - reached through the frontend's nginx reverse proxy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '8080:80'
      - '3443:443'
    volumes:
      # Keep the self-signed cert across restarts so phones don't have to re-accept it.
      - certs:/certs
    depends_on:
      - backend

  tunnel:
    # Trusted HTTPS for phones. The frontend's self-signed certificate lets the page load once
    # you click through the warning, but phone browsers (iPhone Safari especially) still refuse
    # the game's WebSocket on it, which shows up as "Connection lost. Reconnecting…".
    # A Cloudflare quick tunnel gives a real certificate. Find the URL with:
    #   docker compose logs tunnel | grep trycloudflare.com
    # The URL changes every time this container restarts.
    image: cloudflare/cloudflared:2026.9.2
    command: tunnel --no-autoupdate --url http://frontend:80
    restart: unless-stopped
    depends_on:
      - frontend

volumes:
  certs:
