# Cross-origin isolation, so the phone can run WebAssembly on more than one thread.
#
# Included by every static location in common-locations.conf. It is a separate file for one
# specific nginx reason: `add_header` is inherited from an outer level *only if the current
# level declares no add_header of its own*. Every static block here sets its own
# Cache-Control, so a server-level COOP/COEP would be silently dropped in exactly the blocks
# that serve the document - with no error and no warning. Including the same snippet in each
# block is the only way to be sure every response carries it.
#
# What this buys. reid.js asks for threads only when the browser says the page is isolated:
#
#   ort.env.wasm.numThreads = globalThis.crossOriginIsolated
#     ? Math.min(4, navigator.hardwareConcurrency || 1) : 1;
#
# `crossOriginIsolated` is true only when the document was served with both headers below,
# because that is what lets the browser hand out SharedArrayBuffer, which is how ONNX Runtime
# shares tensors between its worker threads. Nothing served these headers before, so that
# branch had never once been taken: OSNet ran single-threaded on every device, and the
# `ort-wasm-simd-threaded.wasm` build shipped in the image was doing the work of the
# non-threaded one. The scan's re-identification pass is the heaviest inference in the app,
# so this is the cheapest remaining win there.
#
# Why require-corp and not credentialless: credentialless is the laxer option but Safari does
# not implement it, and this game is played on phones. require-corp has been supported since
# Safari 15.2. The cost of require-corp is that *every cross-origin subresource* must opt in
# via CORP or CORS or it is blocked outright - which would be a blank screen, not a
# degradation. It is safe here because the client loads nothing cross-origin at all: no CDN,
# no web font, no analytics. index.html references only style.css and app.js, the models come
# from /models/, the runtimes from /vendor/, and /api/ and /events/ are same-origin through
# this same nginx. Verify that still holds before adding any third-party resource, or the app
# will stop loading rather than lose a feature.
#
# Failure is one-directional, which is what makes this safe to ship unmeasured: if isolation
# does not take effect, `crossOriginIsolated` is false and reid.js falls back to one thread -
# exactly today's behaviour. There is no path where enabling this is slower than not.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
# Same-origin subresources do not need CORP under require-corp, so this is belt-and-braces: it
# states the intent explicitly, and it is what would keep these files loadable if they were
# ever moved behind a separate origin or CDN.
add_header Cross-Origin-Resource-Policy "same-origin" always;
