# COOP + COEP, so the browser sets crossOriginIsolated and reid.js can ask ONNX Runtime for
# more than one WASM thread.
#
# This is a separate file included by every static location, rather than one add_header at
# server level, for one nginx reason: add_header is inherited from an outer level *only if the
# current level declares no add_header of its own*. Every static block sets its own
# Cache-Control, so a server-level COOP/COEP would be silently dropped in exactly the blocks
# that serve the document - no error, no warning.
#
# The constraint this imposes (every cross-origin subresource must opt in via CORP/CORS or it
# is blocked outright) and why require-corp rather than credentialless: see
# docs/operations/docker.md#cross-origin-isolation. Do not relax these to add a CDN resource.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
