# Shared between the HTTP and HTTPS server blocks in nginx.conf.
# Every policy here was measured; the reasoning, the numbers and the `nginx -t` + curl
# checklist for changing it live in docs/operations/docker.md. Read that first.

gzip on;
gzip_comp_level 1;
gzip_min_length 1024;
gzip_vary on;
# The WASM runtimes are the whole win (~70% off 11-14 MB). application/octet-stream is
# deliberately absent so the models are never compressed: entropy-dense FlatBuffer/protobuf
# weights only shrink 8-14%, for 115-179 ms of CPU each.
# text/html is always compressed by nginx and cannot be listed or removed.
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  image/svg+xml
  application/wasm;

# ~18 MB of models. Replaced in place under fixed URLs, so this revalidates with an ETag
# rather than going `immutable` - a retuned model still reaches a phone that has played.
# "^~" so no regex location added later can steal these paths and undo the caching.
location ^~ /models/ {
  default_type application/octet-stream; # .tflite, .task and .onnx are all opaque blobs
  etag on;
  if_modified_since exact; # valid values are off|exact|before; "on" stops nginx starting
  add_header Cache-Control "public, max-age=300" always;
  include /etc/nginx/cross-origin-isolation.conf;
  try_files $uri =404;
}

# The pinned vendor runtimes, lifted out of node_modules by frontend/Dockerfile's deps stage,
# so they only move when package-lock.json does. "^~" for the same reason as above.
location ^~ /vendor/ {
  # A types block inside a location replaces the inherited mime.types map, so every type the
  # browser asks for here has to be spelled out. This is not cosmetic: a module script or a
  # WASM binary served as the wrong type is refused outright.
  types {
    text/javascript  js mjs cjs;
    application/wasm wasm;
    application/json json map;
  }
  default_type application/octet-stream;
  etag on;
  if_modified_since exact;
  add_header Cache-Control "public, max-age=86400" always;
  include /etc/nginx/cross-origin-isolation.conf;
  try_files $uri =404;
}

location /api/ {
  client_max_body_size 2m; # scans with re-identification embeddings are ~210 KB
  proxy_pass http://backend:4000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_buffering off;
  proxy_read_timeout 60s; # polls are held open for up to 20s
  gzip off; # compressing a held-open poll would mean buffering it first
}


# The app shell: index.html, app.js, style.css and the app's own .js modules. Stays no-store
# because deploys are `git pull && docker compose up --build -d` with no filename hashing, so
# a cached shell would leave phones running yesterday's client against today's backend.
location / {
  try_files $uri $uri/ =404;
  etag off;
  if_modified_since off;
  add_header Cache-Control "no-store, max-age=0" always;
  include /etc/nginx/cross-origin-isolation.conf;
}
