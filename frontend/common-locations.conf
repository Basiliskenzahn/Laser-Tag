# Shared between the HTTP and HTTPS server blocks in nginx.conf.

# Compression. Only text and WebAssembly are listed, and that is a measured decision rather
# than a default: the two WASM runtimes are by far the biggest thing a phone downloads and
# they shrink by about 70% (ONNX Runtime 13.6 MB -> 4.1 MB, MediaPipe 10.6 MB -> 3.6 MB),
# so this is the single largest first-load win available.
#
# The model files are deliberately *not* in gzip_types. A .tflite/.task is a FlatBuffer
# container and an .onnx is protobuf; the weights inside are already entropy-dense, so
# gzip buys only 7.6-12.7% (measured, see docs/operations/docker.md) while costing
# 115-179 ms of CPU per request. Compressing them would burn a phone's worth of server CPU
# to save a tenth of the bytes. They are served raw and cached instead - see /models/ below.
#
# gzip_comp_level stays at nginx's default 1 on purpose: on the WASM it already captures
# 65-70% of the 74% that level 9 reaches, for a fifth of the CPU (128 ms vs 716 ms).
gzip on;
gzip_comp_level 1;
gzip_min_length 1024;
gzip_vary on; # so any cache in front of us keys on Accept-Encoding
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  image/svg+xml
  application/wasm;
# text/html is always compressed by nginx and cannot be listed or removed.
#
# gzip_proxied is left at its default of "off", which means proxied responses are never
# compressed. That is what keeps /api/ and /events/ safe by default; both blocks below also
# say "gzip off" explicitly so that adding gzip_proxied here later cannot break them.

# The model files: ~18 MB that essentially never change, and the reason a phone used to
# re-download 18 MB on every single page load. "^~" matters here - without it the \.tflite$
# and \.task$ regexes further down would still win (nginx tries regex locations before
# prefix ones) and these files would go back to no-store.
#
# Cached, but revalidated rather than "immutable". The difference matters for how this
# project actually ships a new model: the files are committed under their own names and get
# *replaced in place*, so the URL never changes. Under "immutable" a retuned model would
# simply never reach a phone that had already played - for up to a year, with no way out
# but clearing site data. With a short freshness window plus an ETag instead:
#   - reloads inside the window cost zero requests and zero bytes;
#   - after it, each model is one conditional request answered with a 304 of a few hundred
#     bytes, so the 18 MB download is gone either way;
#   - a replaced model propagates on its own within ~5 minutes of the redeploy.
# A 304 on 18 MB is already essentially the whole win, so there is no reason to trade away
# correctness for it. 300 s is deliberately short because detection tuning is active work.
location ^~ /models/ {
  default_type application/octet-stream; # .tflite, .task and .onnx are all opaque blobs
  etag on;
  if_modified_since exact; # nginx's default; "on" is not a valid value for this directive
  add_header Cache-Control "public, max-age=300" always;
  include /etc/nginx/cross-origin-isolation.conf;
  try_files $uri =404;
}

# The vendor runtimes (MediaPipe tasks-vision, ONNX Runtime Web). Not committed - the
# Dockerfile's deps stage copies them out of node_modules, so their contents are fixed for
# the life of an image and only move when package-lock.json does. That is a much rarer
# event than a model swap, hence the longer window; it is still revalidated rather than
# immutable, because a dependency bump reuses these URLs too.
#
# Matched by path, not by extension, and that distinction is the point: the app's own
# modules must stay uncacheable (see the catch-all at the bottom), and only these vendored
# files are safe to hold on to. "^~" again, so the \.mjs$ and \.wasm$ regexes below do not
# steal these paths back.
location ^~ /vendor/ {
  # A types block inside a location replaces the inherited mime.types map, so everything
  # the browser actually asks for here has to be spelled out. Getting these wrong is not
  # cosmetic: a module script served as the wrong type is refused outright, and so is
  # WebAssembly streaming compilation.
  types {
    text/javascript  js mjs cjs;
    application/wasm wasm;
    application/json json map;
  }
  default_type application/octet-stream;
  etag on;
  if_modified_since exact; # nginx's default; "on" is not a valid value for this directive
  add_header Cache-Control "public, max-age=86400" always;
  include /etc/nginx/cross-origin-isolation.conf;
  try_files $uri =404;
}

# Explicit MIME types for files MediaPipe needs loaded as real JS modules / wasm - nginx's
# default mime.types doesn't reliably cover .mjs and .wasm, and a wrong MIME type on either
# makes the browser refuse to load it (as a module script, or for WebAssembly streaming).
#
# With /vendor/ and /models/ handled above, these four blocks now only catch such files
# *outside* those directories - i.e. ones belonging to the app rather than to a pinned
# dependency. They keep no-store on purpose: caching by extension would cache the app's own
# code and break the "git pull && docker compose up --build -d" deploy.
location ~* \.mjs$ {
  default_type text/javascript;
  etag off;
  if_modified_since off;
  add_header Cache-Control "no-store, max-age=0" always;
  include /etc/nginx/cross-origin-isolation.conf;
  try_files $uri =404;
}

location ~* \.wasm$ {
  default_type application/wasm;
  etag off;
  if_modified_since off;
  add_header Cache-Control "no-store, max-age=0" always;
  include /etc/nginx/cross-origin-isolation.conf;
  try_files $uri =404;
}

location ~* \.task$ {
  default_type application/octet-stream;
  etag off;
  if_modified_since off;
  add_header Cache-Control "no-store, max-age=0" always;
  include /etc/nginx/cross-origin-isolation.conf;
  try_files $uri =404;
}

location ~* \.tflite$ {
  default_type application/octet-stream;
  etag off;
  if_modified_since off;
  add_header Cache-Control "no-store, max-age=0" always;
  include /etc/nginx/cross-origin-isolation.conf;
  try_files $uri =404;
}

location /api/ {
  client_max_body_size 2m; # scans with re-identification embeddings are ~210 KB
  proxy_pass http://backend:4000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_buffering off;
  proxy_read_timeout 60s; # polls are held open for up to 20s
  gzip off; # polls are held open for ~20s; compressing would mean buffering them first
}

location /events/ {
  proxy_pass http://backend:4000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 1h; # keep SSE game event streams open
  gzip off; # an SSE stream must reach the phone event by event, never held back to compress
}

# The app shell: index.html, app.js, style.css and the app's own modules. Stays no-store,
# which is the whole reason the rules above are scoped by path instead of applied globally.
# Deploys are "git pull && docker compose up --build -d" with no filename hashing anywhere,
# so a cached app shell would leave phones running yesterday's client against today's
# backend. These files are small - the largest is identify.js at 52 KB, 17 KB gzipped - so
# refetching them every load costs almost nothing, and gzip above already covers them.
location / {
  try_files $uri $uri/ =404;
  etag off;
  if_modified_since off;
  add_header Cache-Control "no-store, max-age=0" always;
  include /etc/nginx/cross-origin-isolation.conf;
}
