# Serves the static client and reverse-proxies /api/* and /events/* to the backend
# container, so the browser only ever talks to one origin.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/common-locations.conf;
}

server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /certs/cert.pem;
  ssl_certificate_key /certs/key.pem;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/common-locations.conf;
}
