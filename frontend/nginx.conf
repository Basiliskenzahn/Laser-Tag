# Serves the static client and reverse-proxies /ws to the backend container, so the
# browser only ever talks to one origin (this one) - app.js's same-origin WebSocket URL
# ("wss://<host>/ws") needs no change, and phones never see a second, self-signed host.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/common-locations.conf;
}

server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /certs/cert.pem;
  ssl_certificate_key /certs/key.pem;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/common-locations.conf;
}
