<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Laser Tag</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main id="join-screen" class="screen">
      <h1>Laser Tag</h1>
      <p class="tagline">Point. Shoot. Phones only.</p>
      <form id="join-form">
        <label>
          Your name
          <input id="name" maxlength="20" autocomplete="nickname" required />
        </label>
        <label>
          Room code
          <input id="room" maxlength="16" autocapitalize="off" autocomplete="off" spellcheck="false" required />
        </label>
        <button type="submit" id="join-btn">Join game</button>
      </form>
      <p id="join-status" class="status" role="status"></p>
      <p class="hint">Both players enter the same room code. You'll be asked for camera access.</p>
    </main>

    <main id="game-screen" class="screen" hidden>
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div id="damage"></div>
      <div id="crosshair"></div>

      <header id="hud">
        <div class="player">
          <div class="label"><span id="me-name">You</span><span id="me-wins" class="wins"></span></div>
          <div class="hp"><div id="me-hp" class="hp-fill"></div></div>
        </div>
        <div class="player opponent">
          <div class="label"><span id="opp-wins" class="wins"></span><span id="opp-name">Opponent</span></div>
          <div class="hp"><div id="opp-hp" class="hp-fill"></div></div>
        </div>
      </header>

      <div id="banner">
        <p id="banner-text"></p>
        <button id="rematch-btn" hidden>Rematch</button>
      </div>
      <div id="popups"></div>

      <button id="fire-btn" aria-label="Fire">FIRE</button>
      <pre id="debug" hidden></pre>
    </main>
  </body>
</html>
